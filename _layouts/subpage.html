---
layout: default
---

<style>
/* 1. Complete Theme Reset */
header, footer, .sidebar { 
    display: none !important; 
}

/* Force the theme wrapper to take full width and disable its internal centering */
.wrapper {
    max-width: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    display: block !important;
}

body {
    background-color: #ffffff !important;
    margin: 0;
    padding: 0;
    width: 100%;
}

/* 2. Fixed Navbar */
.navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    /* Use percentage padding to ensure consistent horizontal alignment */
    padding: 0 5% !important; 
    box-sizing: border-box !important;
    z-index: 10000;
    transition: all 0.3s ease;
    background: rgba(255, 255, 255, 0.7) !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(0, 0, 0, 0.1);
}

.navbar-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #222 !important; /* Darker text for white background */
    font-weight: 800;
    font-size: 1.2rem;
}

.navbar-logo img {
    height: 40px !important;
    width: auto !important;
    display: block !important;
}

.navbar-links {
    display: flex;
    gap: 25px;
    list-style: none;
    margin: 0;
}

.navbar-links a {
    text-decoration: none;
    color: #444 !important;
    font-weight: 600;
    font-size: 0.95rem;
    transition: color 0.3s ease;
}

.navbar-links a:hover {
    color: #90caf9 !important;
}


/* 3. The Centering Engine (Refined) */
.page-center-payload {
    display: flex;
    justify-content: center; /* Centers horizontally in the flex container */
    width: 100%;
    padding-top: 120px;
    padding-bottom: 100px;
    box-sizing: border-box;
}

/* This is the actual text column */
section {
    width: 90% !important;
    max-width: 850px !important; 
    /* The 'auto' on both sides forces the element into the center */
    margin-left: auto !important;
    margin-right: auto !important;
    padding: 0 !important;
    background: transparent !important;
    float: none !important; /* Prevents theme floats from pulling it left/right */
}

/* 4. Content Formatting */
h1 {
    font-size: 2.5rem !important;
    line-height: 1.2 !important;
    margin-bottom: 30px !important;
    border: none !important;
    font-weight: 800 !important;
    color: #111 !important;
    text-align: left; /* Keep text left-aligned within the centered column */
}

p, li {
    font-size: 1.15rem !important;
    line-height: 1.8 !important;
    color: #333 !important;
    margin-bottom: 25px !important;
    text-align: left;
}

strong, b {
    font-weight: 800 !important;
    color: #000 !important;
}

section img {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
    margin: 20px 0;
    display: block;
}

/* 5. Mobile Responsive Design */
@media (max-width: 768px) {
    body { padding-top: 60px; }
    
    .navbar {
        height: 60px;
        padding: 0 15px !important;
    }
    
    .navbar-logo {
        font-size: 1rem;
        gap: 8px;
    }
    
    .navbar-logo img {
        height: 32px;
    }
    
    .navbar-links {
        gap: 15px;
    }
    
    .navbar-links li {
        height: 60px;
    }
    
    .navbar-links a {
        font-size: 0.85rem;
    }
    
    .page-center-payload {
        padding-top: 80px;
        padding-bottom: 50px;
    }
    
    section {
        width: 95% !important;
        max-width: 100% !important;
    }
    
    h1 {
        font-size: 2rem !important;
        margin-bottom: 20px !important;
    }
    
    p, li {
        font-size: 1rem !important;
        line-height: 1.6 !important;
        margin-bottom: 20px !important;
    }
}

@media (max-width: 480px) {
    body { padding-top: 56px; }
    
    .navbar {
        height: 56px;
        padding: 0 10px !important;
    }
    
    .navbar-logo {
        font-size: 0.9rem;
        gap: 6px;
    }
    
    .navbar-logo img {
        height: 28px;
    }
    
    .navbar-links {
        gap: 8px;
    }
    
    .navbar-links a {
        font-size: 0.75rem;
        padding: 5px 8px;
    }
    
    .navbar-links li {
        height: 56px;
    }
    
    .page-center-payload {
        padding-top: 70px;
        padding-bottom: 30px;
    }
    
    section {
        width: 95% !important;
        padding: 0 10px !important;
    }
    
    h1 {
        font-size: 1.6rem !important;
        margin-bottom: 15px !important;
    }
    
    h2 {
        font-size: 1.3rem !important;
        margin-bottom: 15px !important;
    }
    
    p, li {
        font-size: 0.95rem !important;
        line-height: 1.5 !important;
        margin-bottom: 15px !important;
    }
    
    strong, b {
        font-weight: 700 !important;
    }
}
</style>

<nav class="navbar">
  <a href="/" class="navbar-logo">
    <img src="/resources/hullskater-logo.png" alt="Logo" />
    <span>HullSense</span>
  </a>
  <ul class="navbar-links">
    <li><a href="/">Home</a></li>
    <li><a href="/pages/about/">About</a></li>
    <li><a href="/pages/projects/">Projects</a></li>
  </ul>
</nav>

<div class="page-center-payload">
    <section>
        {{ content }}
    </section>
</div>
